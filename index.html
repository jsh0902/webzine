
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리동작 웹진</title>
  <style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #f2f4f8;
    text-align: center;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 10px;
  }

  .intro {
    color: #666;
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .webzine-list {
    display: grid;
    gap: 16px;
  }

  .webzine-card {
    display: block;
    background: white;
    padding: 24px;
    border-radius: 20px;
    text-decoration: none;
    color: #222;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  .webzine-card h2 {
    display: block;
    font-size: 24px;
    margin: 0 0 8px;
    color: #1f3c88;
    font-weight: bold;
  }

  .webzine-card p {
    margin: 0;
    font-size: 16px;
    color: #555;
  }

  .webzine-card:hover {
    transform: translateY(-2px);
  }

  .webzine-card:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 4px;
  }
</style>
  
</head>
<body>

  <main class="wrap">
