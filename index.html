    * { box-sizing: border-box; }

    body {
      margin: 0;

      background: #f2f4f8;
      color: #222;
      text-align: center;

    .wrap {

 h1 {

    .webzine-list {

    .webzine-card {
      display: block;
      padding: 30px 20px;
      background: white;
      border-radius: 14px;
      text-decoration: none;
      color: #222;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .webzine-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .webzine-card:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }

   .webzine-card h2 {
  margin: 0 0 8px;
  font-size: 20px;
  color: #123b83;
  font-weight: 700;
}

.webzine-card p {
  margin: 0;
  color: #666;
  font-size: 14px;
}

    footer {
      margin-top: 36px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      h1 { font-size: 27px; }
      .webzine-card { padding: 20px 14px; }
    }
  </style>
